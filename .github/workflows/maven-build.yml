name: Build ComitasBotJ Plugins

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4

      - name: Checkout ComitasBotJ
        uses: actions/checkout@v4
        with:
          repository: TheHSI-HQ/ComitasBotJ
          path: ComitasBotJ

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build ComitasBotJ dependencies
        working-directory: ComitasBotJ
        run: mvn -pl comitas-api -am clean install -DskipTests

      - name: Build all direct Maven projects
        shell: bash
        run: |
          for pom in */pom.xml; do
            dir="$(dirname "$pom")"

            echo "Building $dir"
            (
              cd "$dir"
              mvn package
            )
          done

      - name: Collect plugin artifacts
        shell: bash
        run: |
          mkdir -p artifacts

          find */target -maxdepth 1 -type f -name '*.jar' \
            -exec cp {} artifacts/ \;

      - name: Upload all plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: artifacts/*.jar
          if-no-files-found: error